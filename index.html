<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Mimi ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffdee9, #b5fffc);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 20px;
        }

        #countdown {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .time-box {
            background: #f7f7f7;
            padding: 10px;
            border-radius: 10px;
            width: 22%;
        }

        .time-box span {
            font-size: 22px;
            font-weight: bold;
            display: block;
        }

        .time-box small {
            font-size: 12px;
            color: #666;
        }

        #message {
            font-size: 16px;
            line-height: 1.5;
            color: #333;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>For Mimi ❤️</h1>
        <p class="subtitle">Something special is coming…</p>
        <div id="countdown">
            <div class="time-box">
                <span id="days">0</span>
                <small>Days</small>
            </div>
            <div class="time-box">
                <span id="hours">0</span>
                <small>Hours</small>
            </div>
            <div class="time-box">
                <span id="minutes">0</span>
                <small>Minutes</small>
            </div>
            <div class="time-box">
                <span id="seconds">0</span>
                <small>Seconds</small>
            </div>
        </div>
        <p id="message" class="hidden">
            Mimi, you are my calm, my strength, and my favorite person in this world.  
            Happy Birthday ❤️
        </p>
    </div>

    <script>
        // 🎂 Mimi's Birthday Date
        const birthday = new Date("December 29, 2025 00:00:00").getTime();

        const daysEl = document.getElementById("days");
        const hoursEl = document.getElementById("hours");
        const minutesEl = document.getElementById("minutes");
        const secondsEl = document.getElementById("seconds");
        const messageEl = document.getElementById("message");

        function updateCountdown() {
            const now = new Date().getTime();
            const diff = birthday - now;

            if (diff <= 0) {
                document.getElementById("countdown").style.display = "none";
                messageEl.classList.remove("hidden");
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            daysEl.textContent = days;
            hoursEl.textContent = hours;
            minutesEl.textContent = minutes;
            secondsEl.textContent = seconds;
        }

        // Run every second
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
